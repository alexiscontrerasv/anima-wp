name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar skill y versión del tag
        run: |
          pip install pyyaml
          python3 .github/scripts/validate_skill.py --tag "${GITHUB_REF_NAME}"

      - name: Empaquetar skill
        run: |
          mkdir -p dist
          (cd skills && zip -r "../dist/anima-${GITHUB_REF_NAME}.zip" anima)

      - name: Extraer notas del CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/anima-${GITHUB_REF_NAME}.zip" \
            --title "Ánima ${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md
