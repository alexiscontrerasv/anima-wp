name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar skill y versión del tag
        run: |
          pip install pyyaml
          python3 .github/scripts/validate_skill.py --tag "${GITHUB_REF_NAME}"

      - name: Empaquetar skill
        run: |
          mkdir -p dist
          (cd skills && zip -r "../dist/anima-${GITHUB_REF_NAME}.zip" anima)

      - name: Extraer notas del CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md

      - name: Crear o actualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="dist/anima-${tag}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            # El release ya existe (por ejemplo, creado desde la web): se completa.
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "Ánima ${tag}" --notes-file dist/notes.md
          else
            gh release create "$tag" "$asset" --title "Ánima ${tag}" --notes-file dist/notes.md
          fi
